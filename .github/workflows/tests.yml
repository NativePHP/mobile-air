name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]

    name: Tests - PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, simplexml, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/pest

  static-analysis:
    runs-on: ubuntu-latest

    name: Static Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, simplexml, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  code-style:
    runs-on: ubuntu-latest

    name: Code Style

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, simplexml, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint
        run: vendor/bin/pint --test

  # The one test in the suite that talks to the network, so it gets its own
  # job: a CDN blip should read as "couldn't check the binaries manifest",
  # not take the whole test run down with it.
  binary-manifest:
    runs-on: ubuntu-latest

    name: Binary Manifest Signature

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, simplexml, mbstring, sodium
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Asserts main/versions.json is signed with a key in
      # BinaryIntegrity::MANIFEST_KEYS. native:install refuses it otherwise,
      # so shipping a key the manifest isn't signed with breaks every install.
      - name: Check the manifest signature
        env:
          # Locally the test skips when the manifest is unreachable, so being
          # offline doesn't fail the suite. Here it has to actually run.
          NATIVEPHP_ENFORCE_BINARY_MANIFEST: 1
        run: vendor/bin/pest --filter=ManifestSignatureSyncTest
